name: culture-api
on:
  schedule:
    - cron: "41 21 * * 1"   # 매주 화요일 06:41(한국 시각)
  workflow_dispatch:
    inputs:
      only:
        description: "쉼표로 구분한 작업 id(비우면 전체)"
        required: false
        default: ""
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 시험
        run: python3 -m unittest discover -s tests
      - name: 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SEOUL_KEY: ${{ secrets.SEOUL_KEY }}
          KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
          KCISA_BOOKSTORE_KEY: ${{ secrets.KCISA_BOOKSTORE_KEY }}
          KCISA_USEDBOOK_KEY: ${{ secrets.KCISA_USEDBOOK_KEY }}
          KCISA_PRESS_KEY: ${{ secrets.KCISA_PRESS_KEY }}
          ONLY: ${{ github.event.inputs.only }}
        # 작업마다 따로 돌리고(작업당 40분 한도) 끝날 때마다 반영한다. 한 작업이 오래 걸려도 앞의 결과는 남는다
        run: |
          git config user.name "gov-lib-data bot"
          git config user.email "actions@users.noreply.github.com"
          ids="${ONLY//,/ }"
          [ -n "$ids" ] || ids=$(python3 collectors/culture_api.py list | cut -d' ' -f1)
          for id in $ids; do
            timeout 40m python3 collectors/culture_api.py run --only "$id" || echo "$id 시간 초과 또는 오류"
            git add data
            git diff --cached --quiet && continue
            git commit -q -m "culture-api: $(date +%F) $id"
            git pull --rebase -q || true
            git push -q || echo "푸시 실패: $id"
          done
