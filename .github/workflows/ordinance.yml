name: ordinance
on:
  schedule:
    - cron: "17 21 * * 0"   # 매주 월요일 06:17(한국 시각)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 시험
        run: python3 -m unittest discover -s tests
      - name: 수집
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 collectors/ordinance_lib.py run --out data/ordinance
      - name: 반영
        run: |
          git config user.name "gov-lib-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ordinance
          git diff --cached --quiet || git commit -m "ordinance: $(date +%F) 수집"
          git push
