name: spec-fetch
# 공공데이터포털 오픈API 명세(호출 주소·요청 변수·응답 항목)를 catalog/specs/ 에 모은다. 인증키를 쓰지 않는다.
# 후보 목록: catalog/candidates.json. 사람이 Actions 화면에서 "Run workflow" 를 눌러 돌린다(예약 없음).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "쉼표로 구분한 pk(비우면 후보 전체)"
        required: false
        default: ""
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 시험
        run: python3 -m unittest discover -s tests
      - name: 명세 받기
        run: python3 collectors/spec_fetch.py run --only "${{ github.event.inputs.only }}" --dump /tmp/spec-raw
      - name: 구조 조각(진단용 브랜치에서만)
        if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p catalog/specs/_debug
          python3 - <<'PY'
          import glob, os, re
          for f in glob.glob('/tmp/spec-raw/*.html'):
              s = open(f, encoding='utf-8').read()
              out = [f'len={len(s)}', 'DO=' + ' '.join(sorted(set(re.findall(r'[\w/.-]+\.do\b', s))))]
              for k in ('항목명', 'serviceKey', 'selectApi', 'oprtin', 'swagger', 'callBack'):
                  i = s.find(k)
                  if i >= 0:
                      out.append(f'--- {k} @{i}\n' + s[max(0, i - 1200):i + 600])
              open('catalog/specs/_debug/' + os.path.basename(f) + '.txt', 'w', encoding='utf-8').write('\n'.join(out))
          PY
          git add catalog/specs/_debug
      - name: 원본 화면(구조 확인용, 3일 보관, 커밋 안 함)
        uses: actions/upload-artifact@v4
        with: { name: spec-raw, path: /tmp/spec-raw, retention-days: 3, if-no-files-found: ignore }
      - name: 반영
        run: |
          git config user.name "gov-lib-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog/specs
          git diff --cached --quiet || git commit -m "spec-fetch: $(date +%F) 명세"
          git pull --rebase -q || true
          git push
