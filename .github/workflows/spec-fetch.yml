name: spec-fetch
# 공공데이터포털 오픈API 명세(호출 주소·요청 변수·응답 항목)를 catalog/specs/ 에 모은다. 인증키를 쓰지 않는다.
# 후보 목록: catalog/candidates.json. 사람이 Actions 화면에서 "Run workflow" 를 눌러 돌린다(예약 없음).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "쉼표로 구분한 pk(비우면 후보 전체)"
        required: false
        default: ""
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 시험
        run: python3 -m unittest discover -s tests
      - name: (임시) 화면 조각
        run: |
          mkdir -p catalog/_debug
          python3 - <<'PY'
          import re, urllib.request
          s = urllib.request.urlopen(urllib.request.Request("https://www.data.go.kr/data/15062804/fileData.do", headers={"User-Agent": "Mozilla/5.0"}), timeout=60).read().decode("utf-8", "replace")
          out = ["DO=" + " ".join(sorted(set(re.findall(r"[\w/.-]+\.do\b", s))))]
          for k in ("fileDownload", "atchFileId", "fn_fileData", "download", "uddi:", "publicDataDetailPk", "csv"):
              for m in list(re.finditer(re.escape(k), s))[:3]:
                  out.append(f"--- {k} @{m.start()}\n" + s[max(0, m.start() - 400):m.start() + 400])
          open("catalog/_debug/filedata.txt", "w", encoding="utf-8").write("\n".join(out))
          PY
          git add catalog/_debug
          git config user.name "gov-lib-data bot"; git config user.email "actions@users.noreply.github.com"
          git commit -m "debug" -q && git push -q
      - name: (임시) 목록에서 고르기
        env: { DATA_GO_KR_KEY: "${{ secrets.DATA_GO_KR_KEY }}" }
        run: python3 collectors/api_catalog.py run --top 200 --to-candidates
      - name: 명세 받기
        run: python3 collectors/spec_fetch.py run --delay 1.0
      - name: 원본 화면(구조 확인용, 3일 보관, 커밋 안 함)
        uses: actions/upload-artifact@v4
        with: { name: spec-raw, path: /tmp/spec-raw, retention-days: 3, if-no-files-found: ignore }
      - name: 반영
        run: |
          git config user.name "gov-lib-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog/specs
          git diff --cached --quiet || git commit -m "spec-fetch: $(date +%F) 명세"
          git pull --rebase -q || true
          git push
